<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 교실 추첨기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* 넥슨 던파 비트비트체 V2 */
        @font-face {
            font-family: 'DnfBitbeatV2';
            src: url('https://cdn.df.nexon.com/img/common/font/DNFBitBitv2.otf') format('opentype');
            font-weight: 400;
            font-display: swap;
        }

        * {
            font-family: 'DnfBitbeatV2', sans-serif !important;
            letter-spacing: 0.5px;
        }

        body {
            background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.22), transparent 35%),
                        radial-gradient(circle at 80% 80%, rgba(244, 63, 94, 0.2), transparent 35%),
                        linear-gradient(135deg, #070913 0%, #0f172a 50%, #1e102d 100%);
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 슬롯 셀 외형 */
        .slot-cell {
            background: linear-gradient(180deg, #090d16 0%, #171f38 50%, #090d16 100%);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.95), 0 6px 16px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.12);
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            aspect-ratio: 1 / 1;
            overflow: hidden; /* 위아래로 넘어가는 글자 숨김 */
        }
        .slot-cell.spinning {
            border-color: rgba(244, 63, 94, 0.9);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9), 0 0 25px rgba(244, 63, 94, 0.5);
        }
        .slot-cell.stopped-win {
            border-color: rgba(250, 204, 21, 1);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(250, 204, 21, 0.6);
            background: linear-gradient(180deg, #2e1065 0%, #4c1d95 50%, #090d16 100%);
        }
        .slot-cell.stopped-lose {
            border-color: rgba(100, 116, 139, 0.7);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #090d16 100%);
            opacity: 0.75;
        }

        /* [핵심] 위에서 아래로 떨어지는 초고속 롤링 애니메이션 */
        @keyframes reel-downward-spin {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0%); }
        }

        .reel-track {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .reel-track.is-rolling {
            animation: reel-downward-spin 0.12s linear infinite; /* 0.12초 광속 회전 */
            filter: blur(2px); /* 초고속 모션 블러 효과 */
        }

        /* 위에서 아래로 쿵 떨어지며 튕기는 착지 바운스 */
        .reel-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            text-align: center;
        }

        .bounce-land {
            animation: slot-down-bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slot-down-bounce {
            0% { transform: translateY(-50%); opacity: 0.7; }
            65% { transform: translateY(12%); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen p-3 md:p-6 select-none">
    <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col justify-between">
        
        <!-- HEADER -->
        <header class="text-center py-2 mb-2">
            <div class="inline-flex items-center bg-pink-500/10 border border-pink-500/20 px-3.5 py-1 rounded-full mb-1">
                <span class="text-xs text-pink-200">교실 만능 다중 슬롯머신</span>
            </div>
            <h1 class="text-3xl md:text-5xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-pink-400 to-indigo-300 drop-shadow">
                두근두근 교실 추첨기
            </h1>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <main class="flex-grow flex flex-col justify-center">

            <!-- 1. CONFIGURATION VIEW (설정 화면) -->
            <section id="config-section" class="glass-panel rounded-3xl p-5 md:p-8 shadow-2xl space-y-6">
                
                <!-- 상단 옵션 설정: 모드 / 항목수 / 추첨횟수 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-white/10 pb-5">
                    
                    <!-- 1. 확률 입력 방식 -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-300">확률 방식 선택</label>
                        <div class="grid grid-cols-2 gap-1.5 bg-black/40 p-1.5 rounded-2xl border border-white/5">
                            <button type="button" onclick="setProbMode('percent')" id="btn-mode-percent" class="py-2.5 rounded-xl text-xs md:text-sm bg-gradient-to-r from-pink-600 to-rose-600 text-white transition shadow">
                                퍼센트(%)
                            </button>
                            <button type="button" onclick="setProbMode('fraction')" id="btn-mode-fraction" class="py-2.5 rounded-xl text-xs md:text-sm text-slate-400 hover:text-white transition">
                                분수/비율
                            </button>
                        </div>
                    </div>

                    <!-- 2. 항목 개수 (2~6개) -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-300">선택지 개수</label>
                        <div class="grid grid-cols-5 gap-1 bg-black/40 p-1.5 rounded-2xl border border-white/5">
                            <button type="button" onclick="setOptionCount(2)" id="btn-cnt-2" class="py-2.5 rounded-xl text-xs bg-indigo-600 text-white transition shadow">2개</button>
                            <button type="button" onclick="setOptionCount(3)" id="btn-cnt-3" class="py-2.5 rounded-xl text-xs text-slate-400 hover:text-white transition">3개</button>
                            <button type="button" onclick="setOptionCount(4)" id="btn-cnt-4" class="py-2.5 rounded-xl text-xs text-slate-400 hover:text-white transition">4개</button>
                            <button type="button" onclick="setOptionCount(5)" id="btn-cnt-5" class="py-2.5 rounded-xl text-xs text-slate-400 hover:text-white transition">5개</button>
                            <button type="button" onclick="setOptionCount(6)" id="btn-cnt-6" class="py-2.5 rounded-xl text-xs text-slate-400 hover:text-white transition">6개</button>
                        </div>
                    </div>

                    <!-- 3. 슬롯(추첨) 개수 (1~40개) -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-300">슬롯 개수 (1~40개)</label>
                        <div class="flex items-center justify-between bg-black/40 p-1.5 rounded-2xl border border-white/5">
                            <button type="button" onclick="adjustDrawCount(-5)" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs">-5</button>
                            <button type="button" onclick="adjustDrawCount(-1)" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs">-1</button>
                            <input type="number" id="draw-count-input" value="5" min="1" max="40" class="w-14 bg-transparent text-center text-lg text-amber-300 focus:outline-none">
                            <button type="button" onclick="adjustDrawCount(1)" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs">+1</button>
                            <button type="button" onclick="adjustDrawCount(5)" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs">+5</button>
                        </div>
                    </div>
                </div>

                <!-- 옵션 목록 입력 영역 -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-pink-200">선택지 항목 및 확률 설정</label>
                        <span id="prob-hint-text" class="text-[11px] text-slate-400">퍼센트 합계가 정확히 100%여야 합니다.</span>
                    </div>

                    <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <!-- 동적으로 렌더링됨 -->
                    </div>
                </div>

                <!-- 상태 검증 배너 -->
                <div id="status-banner" class="rounded-2xl p-3.5 md:p-4 flex items-center justify-between transition-all">
                    <div>
                        <div id="status-title" class="text-xs md:text-sm">확률 계산 중...</div>
                        <div id="status-desc" class="text-[11px] opacity-80">선택지 확률의 총합을 확인하는 중입니다.</div>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] block text-slate-400" id="status-total-label">총 확률</span>
                        <span id="status-total-display" class="text-xl md:text-2xl">0%</span>
                    </div>
                </div>

                <!-- 하단 시작 버튼 -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                    <label class="flex items-center gap-2 text-xs md:text-sm text-slate-300 cursor-pointer">
                        <input type="checkbox" id="sound-toggle" checked class="w-4 h-4 accent-pink-500 rounded">
                        <span>사운드 효과 ON</span>
                    </label>

                    <button id="btn-to-stage" onclick="goToSlotStage()" disabled class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-pink-500 via-rose-500 to-indigo-600 hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xl rounded-2xl shadow-xl transition transform active:scale-95">
                        추첨하기
                    </button>
                </div>
            </section>

            <!-- 2. MULTI SLOT STAGE VIEW (슬롯머신 추첨 진행 화면) -->
            <section id="slot-stage-section" class="hidden glass-panel rounded-3xl p-5 md:p-7 shadow-2xl space-y-4">
                
                <!-- 슬롯 상단 바 -->
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 pb-4">
                    <button onclick="goToConfig()" id="btn-back-setup" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3.5 py-2 rounded-xl transition text-slate-300">
                        설정 수정하기
                    </button>

                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-400">총 슬롯 수:</span>
                        <span id="display-slot-count-badge" class="px-3 py-1 bg-pink-500/20 border border-pink-500/40 text-pink-300 rounded-lg text-xs">5개</span>
                    </div>

                    <button id="btn-spin-all" onclick="startMultiSlotSpin()" class="px-6 py-2.5 bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 hover:brightness-110 text-lg text-slate-950 rounded-xl shadow-lg transition transform active:scale-95">
                        <span id="spin-btn-text">전체 슬롯 돌리기!</span>
                    </button>
                </div>

                <!-- SLOTS GRID BOARD (위에서 아래로 롤링) -->
                <div class="p-3 md:p-6 bg-slate-950/80 rounded-3xl border border-white/5 min-h-[360px] max-h-[62vh] overflow-y-auto flex items-center justify-center">
                    <div id="slots-grid" class="w-full flex flex-wrap justify-center content-center gap-3.5 md:gap-5 max-w-[1100px] mx-auto p-1">
                        <!-- 동적으로 슬롯 셀이 주입됨 -->
                    </div>
                </div>

                <!-- STATS & HISTORY PANEL -->
                <div class="pt-2 border-t border-white/10 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base text-slate-200">
                            실시간 누적 추첨 결과 (<span id="total-roll-count">0</span>회 누적)
                        </h3>
                        <button onclick="clearHistoryLogs()" class="text-[11px] text-slate-400 hover:text-rose-400 transition">
                            기록 비우기
                        </button>
                    </div>

                    <!-- 통계 뱃지 목록 -->
                    <div id="stats-badge-list" class="flex flex-wrap gap-2">
                        <!-- 동적 통계 태그 -->
                    </div>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="text-center text-[11px] text-slate-500 py-2">
            두근두근 교실 멀티 슬롯머신 &bull; DnfBitbeatV2 Game Font & Ultra-Fast Downward Reel
        </footer>
    </div>

    <script>
        /* ----------------------------------------------------
           1. 상태 변수 및 기본값
        ---------------------------------------------------- */
        let probMode = 'percent'; 
        let optionCount = 2;       
        let drawSlotCount = 5;     
        let isSpinning = false;

        let options = [
            { id: 1, name: '당첨', val: 20 },
            { id: 2, name: '꽝', val: 80 }
        ];

        let historyLogs = [];

        /* ----------------------------------------------------
           2. Web Audio API 사운드 엔진
        ---------------------------------------------------- */
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTickSound() {
            if (!document.getElementById('sound-toggle').checked) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(360 + Math.random() * 140, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.035);
                gain.gain.setValueAtTime(0.09, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.035);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.035);
            } catch(e) {}
        }

        function playStopThud() {
            if (!document.getElementById('sound-toggle').checked) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(190, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function playFanfare() {
            if (!document.getElementById('sound-toggle').checked) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                    gain.gain.setValueAtTime(0, now + idx * 0.09);
                    gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.09 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.09);
                    osc.stop(now + idx * 0.09 + 0.35);
                });
            } catch(e) {}
        }

        function playFailSound() {
            if (!document.getElementById('sound-toggle').checked) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const notes = [349.23, 329.63, 311.13, 270.00];
                const durations = [0.25, 0.25, 0.25, 0.6];
                
                let curTime = now;
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, curTime);
                    
                    if (idx === 3) {
                        osc.frequency.linearRampToValueAtTime(220.00, curTime + durations[idx]);
                    }

                    gain.gain.setValueAtTime(0.18, curTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, curTime + durations[idx]);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(curTime);
                    osc.stop(curTime + durations[idx]);

                    curTime += durations[idx];
                });
            } catch(e) {}
        }

        /* ----------------------------------------------------
           3. 설정 화면 로직
        ---------------------------------------------------- */
        window.onload = function() {
            renderOptionInputs();
            validatePercentages();
        };

        function setProbMode(mode) {
            probMode = mode;
            const btnPct = document.getElementById('btn-mode-percent');
            const btnFrac = document.getElementById('btn-mode-fraction');
            const hint = document.getElementById('prob-hint-text');

            if (mode === 'percent') {
                btnPct.className = "py-2.5 rounded-xl text-xs md:text-sm bg-gradient-to-r from-pink-600 to-rose-600 text-white transition shadow";
                btnFrac.className = "py-2.5 rounded-xl text-xs md:text-sm text-slate-400 hover:text-white transition";
                hint.innerText = "퍼센트 합계가 정확히 100%여야 합니다.";
                if (options.length === 2 && options[0].val === 1 && options[1].val === 4) {
                    options[0].val = 20;
                    options[1].val = 80;
                }
            } else {
                btnFrac.className = "py-2.5 rounded-xl text-xs md:text-sm bg-gradient-to-r from-indigo-600 to-sky-600 text-white transition shadow";
                btnPct.className = "py-2.5 rounded-xl text-xs md:text-sm text-slate-400 hover:text-white transition";
                hint.innerText = "가중치(비율)를 정수로 자유롭게 입력하세요. (예: 1 : 4)";
                if (options.length === 2 && options[0].val === 20 && options[1].val === 80) {
                    options[0].val = 1;
                    options[1].val = 4;
                }
            }
            renderOptionInputs();
            validatePercentages();
        }

        function setOptionCount(count) {
            optionCount = count;
            for (let i = 2; i <= 6; i++) {
                const btn = document.getElementById(`btn-cnt-${i}`);
                if (i === count) {
                    btn.className = "py-2.5 rounded-xl text-xs bg-indigo-600 text-white transition shadow";
                } else {
                    btn.className = "py-2.5 rounded-xl text-xs text-slate-400 hover:text-white transition";
                }
            }

            while (options.length < count) {
                const nextId = options.length + 1;
                options.push({
                    id: nextId,
                    name: `항목 ${String.fromCharCode(64 + nextId)}`,
                    val: probMode === 'percent' ? 0 : 1
                });
            }
            if (options.length > count) {
                options = options.slice(0, count);
            }

            renderOptionInputs();
            validatePercentages();
        }

        function adjustDrawCount(delta) {
            const input = document.getElementById('draw-count-input');
            let val = parseInt(input.value) || 1;
            val = Math.max(1, Math.min(40, val + delta));
            input.value = val;
            drawSlotCount = val;
        }

        document.getElementById('draw-count-input').addEventListener('input', (e) => {
            let val = parseInt(e.target.value) || 1;
            drawSlotCount = Math.max(1, Math.min(40, val));
        });

        function renderOptionInputs() {
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const unit = probMode === 'percent' ? '%' : '비율';

            options.forEach((opt, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center gap-2 bg-slate-900/90 p-2.5 rounded-2xl border border-slate-800";
                row.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-slate-800 text-pink-400 text-xs flex items-center justify-center border border-slate-700 flex-shrink-0">${idx + 1}</span>
                    <input type="text" value="${opt.name}" oninput="updateOptName(${idx}, this.value)" placeholder="항목 이름" 
                        class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs md:text-sm text-slate-100 focus:border-pink-500 focus:outline-none">
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        <input type="number" min="0" step="any" value="${opt.val}" oninput="updateOptVal(${idx}, this.value)"
                            class="w-16 bg-slate-800 border border-slate-700 rounded-xl px-2 py-1.5 text-xs md:text-sm text-center text-amber-300 focus:border-pink-500 focus:outline-none">
                        <span class="text-xs text-slate-400 w-7">${unit}</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function updateOptName(idx, v) { options[idx].name = v; }
        function updateOptVal(idx, v) { 
            options[idx].val = parseFloat(v) || 0; 
            validatePercentages(); 
        }

        function validatePercentages() {
            const total = options.reduce((sum, o) => sum + (parseFloat(o.val) || 0), 0);
            const banner = document.getElementById('status-banner');
            const title = document.getElementById('status-title');
            const desc = document.getElementById('status-desc');
            const totalLabel = document.getElementById('status-total-label');
            const totalDisplay = document.getElementById('status-total-display');
            const startBtn = document.getElementById('btn-to-stage');

            if (probMode === 'percent') {
                const formatted = Math.round(total * 10) / 10;
                totalLabel.innerText = "확률 총합";
                totalDisplay.innerText = `${formatted}%`;

                if (Math.abs(formatted - 100) < 0.01) {
                    banner.className = "rounded-2xl p-3.5 md:p-4 flex items-center justify-between bg-emerald-950/60 border border-emerald-500/40 text-emerald-200 transition-all";
                    title.innerText = "설정 완료!";
                    desc.innerText = "합계가 100%입니다. 슬롯머신을 시작할 수 있습니다.";
                    startBtn.disabled = false;
                } else {
                    banner.className = "rounded-2xl p-3.5 md:p-4 flex items-center justify-between bg-rose-950/60 border border-rose-500/40 text-rose-200 transition-all";
                    title.innerText = "확률 수정 필요";
                    desc.innerText = formatted > 100 
                        ? `${(formatted - 100).toFixed(1)}% 초과되었습니다.` 
                        : `${(100 - formatted).toFixed(1)}% 부족합니다.`;
                    startBtn.disabled = true;
                }
            } else {
                totalLabel.innerText = "가중치 합";
                totalDisplay.innerText = `${total}`;

                if (total > 0) {
                    banner.className = "rounded-2xl p-3.5 md:p-4 flex items-center justify-between bg-sky-950/60 border border-sky-500/40 text-sky-200 transition-all";
                    title.innerText = "비율 설정 완료!";
                    const preview = options.map(o => `${Math.round(((o.val || 0) / total) * 100)}%`).join(' : ');
                    desc.innerText = `실제 환산 확률: [ ${preview} ]`;
                    startBtn.disabled = false;
                } else {
                    banner.className = "rounded-2xl p-3.5 md:p-4 flex items-center justify-between bg-rose-950/60 border border-rose-500/40 text-rose-200 transition-all";
                    title.innerText = "가중치 입력 필요";
                    desc.innerText = "1 이상의 가중치를 입력해주세요.";
                    startBtn.disabled = true;
                }
            }
        }

        /* ----------------------------------------------------
           4. 슬롯머신 스테이지 & 상하 릴(Reel) 스트립 빌드
        ---------------------------------------------------- */
        function goToSlotStage() {
            drawSlotCount = Math.max(1, Math.min(40, parseInt(document.getElementById('draw-count-input').value) || 1));
            document.getElementById('display-slot-count-badge').innerText = `${drawSlotCount}개`;

            document.getElementById('config-section').classList.add('hidden');
            document.getElementById('slot-stage-section').classList.remove('hidden');

            buildSlotGrid();
            updateHistoryUI();
        }

        function goToConfig() {
            if (isSpinning) return;
            document.getElementById('slot-stage-section').classList.add('hidden');
            document.getElementById('config-section').classList.remove('hidden');
        }

        function buildSlotGrid() {
            const grid = document.getElementById('slots-grid');
            grid.innerHTML = '';

            let widthStyle = '';
            let fontSizeClass = '';
            let numSizeClass = 'text-xs md:text-sm';

            if (drawSlotCount === 1) {
                widthStyle = 'width: min(70vw, 340px);';
                fontSizeClass = 'text-4xl md:text-6xl';
                numSizeClass = 'text-base md:text-lg';
            } else if (drawSlotCount === 2) {
                widthStyle = 'width: min(42vw, 260px);';
                fontSizeClass = 'text-3xl md:text-5xl';
            } else if (drawSlotCount <= 4) {
                widthStyle = `width: min(${Math.floor(90 / drawSlotCount)}vw, 210px);`;
                fontSizeClass = 'text-2xl md:text-4xl';
            } else {
                widthStyle = 'width: calc(20% - 16px); min-width: 120px; max-width: 185px;';
                fontSizeClass = 'text-xl md:text-2xl lg:text-3xl';
            }

            for (let i = 0; i < drawSlotCount; i++) {
                const slot = document.createElement('div');
                slot.id = `slot-item-${i}`;
                slot.style = widthStyle;
                slot.className = `slot-cell rounded-3xl relative flex-shrink-0 flex items-center justify-center`;
                slot.innerHTML = `
                    <div class="absolute top-2.5 left-3 ${numSizeClass} text-slate-400 z-10">#${i + 1}</div>
                    <div id="reel-track-${i}" class="reel-track">
                        <div class="reel-item ${fontSizeClass} text-amber-300 drop-shadow-md">준비</div>
                    </div>
                `;
                grid.appendChild(slot);
            }
        }

        /* ----------------------------------------------------
           5. 아래로 광속 롤링(Downward Fast Spin) 엔진
        ---------------------------------------------------- */
        function checkIfLoseItem(name, itemIndex) {
            const loseKeywords = ['꽝', '다음', '실패', '탈락', '노당첨', 'x', 'lose'];
            const lower = name.toLowerCase();
            const hasKeyword = loseKeywords.some(kw => lower.includes(kw));

            if (hasKeyword) return true;

            const anyHasKeyword = options.some(o => loseKeywords.some(kw => o.name.toLowerCase().includes(kw)));
            if (!anyHasKeyword && itemIndex === options.length - 1) {
                return true;
            }
            return false;
        }

        function getRandomPickedItem() {
            const totalWeight = options.reduce((sum, o) => sum + (parseFloat(o.val) || 0), 0);
            const rand = Math.random() * totalWeight;
            let acc = 0;
            for (let i = 0; i < options.length; i++) {
                acc += (parseFloat(options[i].val) || 0);
                if (rand <= acc) return { ...options[i], itemIdx: i };
            }
            return { ...options[options.length - 1], itemIdx: options.length - 1 };
        }

        function startMultiSlotSpin() {
            if (isSpinning) return;
            getAudioContext();
            isSpinning = true;

            const spinBtn = document.getElementById('btn-spin-all');
            const backBtn = document.getElementById('btn-back-setup');
            const spinBtnText = document.getElementById('spin-btn-text');

            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');
            backBtn.classList.add('opacity-30', 'pointer-events-none');
            spinBtnText.innerText = "추첨 롤링 중...";

            const slotResults = [];
            for (let i = 0; i < drawSlotCount; i++) {
                slotResults.push(getRandomPickedItem());
            }

            let fontSizeClass = 'text-xl md:text-2xl lg:text-3xl';
            if (drawSlotCount === 1) fontSizeClass = 'text-4xl md:text-6xl';
            else if (drawSlotCount === 2) fontSizeClass = 'text-3xl md:text-5xl';
            else if (drawSlotCount <= 4) fontSizeClass = 'text-2xl md:text-4xl';

            // 연속된 릴 스트립 리스트
            const stripItems = [];
            for (let r = 0; r < 8; r++) {
                options.forEach(o => stripItems.push(o.name));
            }
            const stripHtml = stripItems.map(name => `<div class="reel-item ${fontSizeClass} text-amber-300 drop-shadow-md">${name}</div>`).join('');

            // 모든 슬롯의 릴을 아래 방향으로 초고속 가동
            for (let i = 0; i < drawSlotCount; i++) {
                const slotEl = document.getElementById(`slot-item-${i}`);
                const trackEl = document.getElementById(`reel-track-${i}`);

                slotEl.classList.remove('stopped-win', 'stopped-lose');
                slotEl.classList.add('spinning');

                trackEl.innerHTML = stripHtml;
                trackEl.classList.remove('bounce-land');
                trackEl.classList.add('is-rolling');
            }

            // 고속 롤링 사운드 재생
            const tickInterval = setInterval(() => {
                playTickSound();
            }, 55);

            let currentStopIndex = 0;

            // 순차적으로 롤링을 멈추고 최종 결과로 착지
            function stopNextSlot() {
                if (currentStopIndex < drawSlotCount) {
                    const slotEl = document.getElementById(`slot-item-${currentStopIndex}`);
                    const trackEl = document.getElementById(`reel-track-${currentStopIndex}`);
                    const res = slotResults[currentStopIndex];

                    slotEl.classList.remove('spinning');
                    trackEl.classList.remove('is-rolling');

                    const isLose = checkIfLoseItem(res.name, res.itemIdx);
                    const textColor = isLose ? 'text-slate-400' : 'text-amber-300';

                    if (isLose) {
                        slotEl.classList.add('stopped-lose');
                    } else {
                        slotEl.classList.add('stopped-win');
                    }

                    // 최종 결과 착지 + 위에서 아래로 꽂히는 바운스
                    trackEl.innerHTML = `<div class="reel-item ${fontSizeClass} ${textColor} drop-shadow-md">${res.name}</div>`;
                    trackEl.classList.add('bounce-land');

                    playStopThud();

                    historyLogs.unshift({
                        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        slotNum: currentStopIndex + 1,
                        name: res.name
                    });

                    currentStopIndex++;
                    const stopDelay = drawSlotCount > 15 ? 50 : (drawSlotCount > 5 ? 85 : 160);
                    setTimeout(stopNextSlot, stopDelay);
                } else {
                    // 전체 멈춤 완료
                    clearInterval(tickInterval);
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50');
                    backBtn.classList.remove('opacity-30', 'pointer-events-none');
                    spinBtnText.innerText = "전체 슬롯 돌리기!";

                    const hasWinner = slotResults.some(r => !checkIfLoseItem(r.name, r.itemIdx));

                    if (hasWinner) {
                        if (typeof confetti === 'function') {
                            confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
                        }
                        playFanfare();
                    } else {
                        playFailSound();
                    }

                    updateHistoryUI();
                }
            }

            // 1.1초간 광속 롤링 후 1번 슬롯부터 순차 정지
            setTimeout(() => {
                stopNextSlot();
            }, 1100);
        }

        /* ----------------------------------------------------
           6. 통계 업데이트
        ---------------------------------------------------- */
        function updateHistoryUI() {
            document.getElementById('total-roll-count').innerText = historyLogs.length;
            const badgeList = document.getElementById('stats-badge-list');

            if (historyLogs.length === 0) {
                badgeList.innerHTML = '<span class="text-[11px] text-slate-500">추첨을 진행하면 통계가 집계됩니다.</span>';
                return;
            }

            const counts = {};
            options.forEach(o => counts[o.name] = 0);
            historyLogs.forEach(log => {
                counts[log.name] = (counts[log.name] || 0) + 1;
            });

            badgeList.innerHTML = Object.entries(counts).map(([name, cnt]) => {
                const pct = Math.round((cnt / historyLogs.length) * 100);
                return `
                    <div class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 border border-slate-700/80 rounded-xl text-xs shadow">
                        <span class="text-slate-300">${name}:</span>
                        <span class="text-amber-300">${cnt}회</span>
                        <span class="text-[10px] text-slate-500">(${pct}%)</span>
                    </div>
                `;
            }).join('');
        }

        function clearHistoryLogs() {
            if (isSpinning) return;
            historyLogs = [];
            updateHistoryUI();
        }
    </script>
</body>
