<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 만능 확률 뽑기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        jua: ['Jua', 'sans-serif'],
                        sans: ['Noto Sans KR', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .slot-window {
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(244, 63, 94, 0.4);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.5); }
            50% { box-shadow: 0 0 35px rgba(244, 63, 94, 0.9); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen p-3 md:p-6">
    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col">
        <!-- Header -->
        <header class="text-center py-4 mb-4">
            <div class="inline-flex items-center gap-2 bg-gradient-to-r from-pink-500/20 to-purple-500/20 border border-pink-500/30 px-4 py-1.5 rounded-full mb-2">
                <i class="fa-solid fa-clover text-pink-400"></i>
                <span class="text-sm font-semibold text-pink-200">두근두근 만능 이벤트</span>
            </div>
            <h1 class="text-3xl md:text-5xl font-jua tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-pink-400 to-purple-300 drop-shadow-md">
                🎰 두근두근 확률 뽑기
            </h1>
        </header>

        <!-- MAIN CONTAINER -->
        <main class="flex-grow flex flex-col justify-center">
            
            <!-- SECTION 1: CONFIGURATION PANEL (설정 화면) -->
            <section id="config-section" class="glass-card rounded-2xl p-5 md:p-8 shadow-2xl transition-all duration-300">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-white/10 pb-4 mb-6 gap-3">
                    <div>
                        <h2 class="text-2xl font-jua text-amber-300 flex items-center gap-2">
                            <i class="fa-solid fa-sliders"></i> 뽑기 옵션 및 확률 설정
                        </h2>
                        <p class="text-xs md:text-sm text-slate-300">원하는 선택지와 확률을 자유롭게 입력하세요.</p>
                    </div>
                </div>

                <!-- Option Count Selector -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-2 text-pink-200">
                        1. 선택지 개수 설정 (1 ~ 5개)
                    </label>
                    <div class="grid grid-cols-5 gap-2 max-w-xs">
                        <button type="button" onclick="setOptionCount(1)" id="btn-count-1" class="count-btn py-2 rounded-xl bg-slate-800 border border-slate-600 font-bold hover:border-pink-500 transition">1개</button>
                        <button type="button" onclick="setOptionCount(2)" id="btn-count-2" class="count-btn py-2 rounded-xl bg-slate-800 border border-slate-600 font-bold hover:border-pink-500 transition">2개</button>
                        <button type="button" onclick="setOptionCount(3)" id="btn-count-3" class="count-btn py-2 rounded-xl bg-slate-800 border border-slate-600 font-bold hover:border-pink-500 transition">3개</button>
                        <button type="button" onclick="setOptionCount(4)" id="btn-count-4" class="count-btn py-2 rounded-xl bg-slate-800 border border-slate-600 font-bold hover:border-pink-500 transition">4개</button>
                        <button type="button" onclick="setOptionCount(5)" id="btn-count-5" class="count-btn py-2 rounded-xl bg-slate-800 border border-slate-600 font-bold hover:border-pink-500 transition">5개</button>
                    </div>
                </div>

                <!-- Option Items Inputs -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-2 text-pink-200">
                        2. 선택지 항목 및 확률 설정 (합계가 정확히 100%여야 함)
                    </label>

                    <div id="options-container" class="space-y-3">
                        <!-- Dynamic option rows will be generated here -->
                    </div>
                </div>

                <!-- Total Percentage Status Banner -->
                <div id="status-banner" class="rounded-xl p-4 mb-6 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <span id="status-icon" class="text-2xl">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                        </span>
                        <div>
                            <div id="status-title" class="font-bold text-sm md:text-base">확률 계산 중...</div>
                            <div id="status-desc" class="text-xs opacity-90">선택지 확률의 총합을 확인하는 중입니다.</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs block text-slate-300">총 확률</span>
                        <span id="total-percent-display" class="font-jua text-2xl md:text-3xl">0%</span>
                    </div>
                </div>

                <!-- Sound Option & Start Button -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer select-none">
                        <input type="checkbox" id="sound-toggle" checked class="w-4 h-4 accent-pink-500 rounded">
                        <span><i class="fa-solid fa-volume-high text-pink-400"></i> 사운드 효과 ON</span>
                    </label>

                    <button id="start-game-btn" onclick="goToGame()" disabled class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-jua text-xl rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                        <span>게임 시작하기</span>
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>
            </section>

            <!-- SECTION 2: GAME STAGE (뽑기 진행 화면) -->
            <section id="game-section" class="hidden glass-card rounded-2xl p-5 md:p-8 shadow-2xl relative overflow-hidden">
                
                <!-- Navigation & Student Name Input -->
                <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-white/10">
                    <button onclick="goToConfig()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-300">
                        <i class="fa-solid fa-gear"></i> 설정 수정
                    </button>

                    <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
                        <i class="fa-solid fa-user text-pink-400 text-sm"></i>
                        <input type="text" id="student-name-input" placeholder="참여자 이름/번호 (선택)" class="bg-transparent text-sm focus:outline-none w-36 text-pink-200 placeholder-slate-500">
                    </div>
                </div>

                <!-- SLOT MACHINE STAGE -->
                <div class="flex flex-col items-center justify-center my-4">
                    
                    <!-- Slot Display Box -->
                    <div class="relative w-full max-w-md bg-slate-950 rounded-2xl p-6 border-4 border-pink-500/50 slot-window animate-pulse-glow text-center my-4">
                        <div class="text-xs font-semibold text-pink-400 tracking-wider uppercase mb-2">
                            <i class="fa-solid fa-dice text-amber-400"></i> 무엇이 나올까요?
                        </div>
                        
                        <!-- Slot Reel Screen -->
                        <div id="slot-reel-window" class="h-28 overflow-hidden relative flex items-center justify-center rounded-xl bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 border border-slate-700">
                            <div id="slot-reel-text" class="font-jua text-3xl md:text-4xl text-amber-300 transition-all transform">
                                🎁 준비 완료!
                            </div>
                        </div>

                        <!-- Pointer Indicator -->
                        <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-amber-400 text-slate-950 px-3 py-0.5 rounded-full text-xs font-bold shadow">
                            CHANCE
                        </div>
                    </div>

                    <!-- Result Card Reveal Overlay (Shown after roll) -->
                    <div id="result-modal" class="hidden my-2 p-4 bg-gradient-to-r from-purple-900/80 to-pink-900/80 border border-pink-400/50 rounded-2xl w-full max-w-md text-center transform animate-bounce-short">
                        <div id="result-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-2 bg-amber-400 text-slate-900">
                            결과 발표
                        </div>
                        <div id="result-title" class="font-jua text-4xl text-amber-200 mb-1">
                            결과 나오는 중
                        </div>
                        <div id="result-desc" class="text-xs text-slate-200">
                            축하합니다!
                        </div>
                    </div>

                    <!-- Spin Controls -->
                    <div class="mt-4 flex flex-col sm:flex-row gap-3 w-full max-w-md">
                        <button id="spin-btn" onclick="startSpin()" class="flex-1 py-4 bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 hover:opacity-90 font-jua text-2xl text-slate-950 rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate text-slate-950"></i>
                            <span id="spin-btn-text">뽑기 돌리기!</span>
                        </button>
                    </div>
                </div>

                <!-- SECTION 3: HISTORY LOG (진행 기록판) -->
                <div class="mt-8 pt-6 border-t border-white/10">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-jua text-lg text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-pink-400"></i> 진행 및 뽑기 기록 (<span id="history-count">0</span>회)
                        </h3>
                        <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-rose-400 transition">
                            <i class="fa-solid fa-trash-can"></i> 기록 초기화
                        </button>
                    </div>

                    <!-- Quick Stats Badges -->
                    <div id="stats-container" class="flex flex-wrap gap-2 mb-4">
                        <!-- Stat badges dynamically generated -->
                    </div>

                    <!-- History Scroll Box -->
                    <div class="max-h-40 overflow-y-auto bg-slate-950/60 rounded-xl p-3 border border-slate-800 text-sm">
                        <div id="history-list" class="space-y-2">
                            <p class="text-xs text-slate-500 text-center py-2">아직 진행된 뽑기 기록이 없습니다.</p>
                        </div>
                    </div>
                </div>

            </section>
        </main>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-400 py-4 mt-4">
            두근두근 만능 이벤트 뽑기 웹앱
        </footer>
    </div>

    <!-- UI Alert Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card bg-slate-900 border border-pink-500/40 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div id="modal-icon" class="text-4xl text-amber-400 mb-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="font-jua text-2xl text-slate-100 mb-2">알림</h3>
            <p id="modal-body" class="text-sm text-slate-300 mb-6">내용이 들어갑니다.</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl transition">
                확인
            </button>
        </div>
    </div>

    <script>
        // APP STATE
        let optionCount = 3;
        let options = [
            { id: 1, name: '선택지 A', percent: 20 },
            { id: 2, name: '선택지 B', percent: 30 },
            { id: 3, name: '선택지 C', percent: 50 }
        ];
        let historyLogs = [];
        let isSpinning = false;

        // AUDIO SYNTHESIZER (Web Audio API)
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTickSound() {
            if (!document.getElementById('sound-toggle').checked) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350 + Math.random() * 100, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function playWinFanfare() {
            if (!document.getElementById('sound-toggle').checked) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    
                    gain.gain.setValueAtTime(0, now + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.1 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.4);
                });
            } catch(e) {}
        }

        window.onload = function() {
            renderOptionInputs();
            validatePercentages();
        };

        function setOptionCount(count) {
            optionCount = count;
            
            while (options.length < count) {
                const newId = options.length + 1;
                options.push({
                    id: newId,
                    name: `선택지 ${String.fromCharCode(64 + newId)}`,
                    percent: 0
                });
            }
            if (options.length > count) {
                options = options.slice(0, count);
            }

            renderOptionInputs();
            validatePercentages();
        }

        function renderOptionInputs() {
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`btn-count-${i}`);
                if (i === optionCount) {
                    btn.className = "count-btn py-2 rounded-xl bg-pink-600 border border-pink-400 font-bold text-white shadow transition";
                } else {
                    btn.className = "count-btn py-2 rounded-xl bg-slate-800 border border-slate-600 font-bold text-slate-300 hover:border-pink-500 transition";
                }
            }

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            options.forEach((opt, idx) => {
                const row = document.createElement('div');
                row.className = "flex flex-col sm:flex-row items-center gap-2 bg-slate-900/90 p-3 rounded-xl border border-slate-800";
                row.innerHTML = `
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <span class="w-6 h-6 rounded-full bg-slate-800 text-pink-400 font-bold text-xs flex items-center justify-center border border-slate-700">${idx + 1}</span>
                    </div>

                    <input type="text" value="${opt.name}" oninput="updateOptionName(${idx}, this.value)" placeholder="항목 이름을 입력하세요" 
                        class="flex-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:border-pink-500 focus:outline-none">

                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <label class="text-xs text-slate-400">확률(%):</label>
                        <input type="number" min="0" max="100" value="${opt.percent}" oninput="updateOptionPercent(${idx}, this.value)" 
                            class="w-20 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-center font-bold text-amber-300 focus:border-pink-500 focus:outline-none">
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function updateOptionName(idx, val) {
            options[idx].name = val;
        }

        function updateOptionPercent(idx, val) {
            options[idx].percent = parseFloat(val) || 0;
            validatePercentages();
        }

        function validatePercentages() {
            const total = options.reduce((sum, item) => sum + (parseFloat(item.percent) || 0), 0);
            const formattedTotal = Math.round(total * 10) / 10;

            const banner = document.getElementById('status-banner');
            const icon = document.getElementById('status-icon');
            const title = document.getElementById('status-title');
            const desc = document.getElementById('status-desc');
            const display = document.getElementById('total-percent-display');
            const startBtn = document.getElementById('start-game-btn');

            display.innerText = `${formattedTotal}%`;

            if (Math.abs(formattedTotal - 100) < 0.1) {
                banner.className = "rounded-xl p-4 mb-6 flex items-center justify-between bg-emerald-950/60 border border-emerald-500/50 text-emerald-200 transition-all";
                icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
                title.innerText = "설정 완료! 준비 되었습니다.";
                desc.innerText = "모든 확률의 합이 정확히 100%입니다. 게임을 시작하세요!";
                startBtn.disabled = false;
            } else {
                banner.className = "rounded-xl p-4 mb-6 flex items-center justify-between bg-rose-950/60 border border-rose-500/50 text-rose-200 transition-all";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>';
                title.innerText = "확률 수정 필요!";
                desc.innerText = formattedTotal > 100 
                    ? `확률의 합이 100%를 초과했습니다 (${(formattedTotal - 100).toFixed(1)}% 초과). 값을 낮춰주세요.`
                    : `확률의 합이 100%에 부족합니다 (${(100 - formattedTotal).toFixed(1)}% 부족). 값을 올려주세요.`;
                startBtn.disabled = true;
            }
        }

        function goToGame() {
            document.getElementById('config-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            resetSlotDisplay();
            updateHistoryUI();
        }

        function goToConfig() {
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('config-section').classList.remove('hidden');
        }

        function resetSlotDisplay() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('slot-reel-text').innerText = "🎁 준비 완료!";
            document.getElementById('slot-reel-text').className = "font-jua text-3xl md:text-4xl text-amber-300 transition-all transform";
        }

        function getRandomOption() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (let i = 0; i < options.length; i++) {
                cumulative += options[i].percent;
                if (rand <= cumulative) {
                    return options[i];
                }
            }
            return options[options.length - 1];
        }

        function startSpin() {
            if (isSpinning) return;
            getAudioContext();
            
            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            const reelText = document.getElementById('slot-reel-text');
            const resultModal = document.getElementById('result-modal');

            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');
            resultModal.classList.add('hidden');

            const selectedResult = getRandomOption();
            const dummyItems = options.map(o => o.name);

            let currentStep = 0;
            let totalSteps = 30 + Math.floor(Math.random() * 10);
            let speed = 50;

            function step() {
                currentStep++;
                
                const randomItem = dummyItems[Math.floor(Math.random() * dummyItems.length)];
                reelText.innerText = randomItem;
                reelText.style.transform = `scale(${0.9 + Math.random() * 0.2})`;
                
                playTickSound();

                if (currentStep < totalSteps) {
                    if (currentStep > totalSteps - 15) {
                        speed += 25;
                    } else if (currentStep > totalSteps - 8) {
                        speed += 50;
                    }
                    setTimeout(step, speed);
                } else {
                    setTimeout(() => {
                        finishSpin(selectedResult);
                    }, speed + 100);
                }
            }

            step();
        }

        function finishSpin(result) {
            isSpinning = false;
            const spinBtn = document.getElementById('spin-btn');
            const reelText = document.getElementById('slot-reel-text');
            const resultModal = document.getElementById('result-modal');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');
            const resultBadge = document.getElementById('result-badge');

            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50');

            reelText.innerText = result.name;
            reelText.style.transform = "scale(1.1)";
            reelText.className = "font-jua text-3xl md:text-5xl text-amber-300 font-bold drop-shadow-lg";

            resultBadge.innerText = "🎉 당첨 결과";
            resultTitle.innerText = result.name;
            resultDesc.innerText = `[${result.name}] 항목이 선택되었습니다!`;
            resultModal.classList.remove('hidden');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
            playWinFanfare();

            const studentInput = document.getElementById('student-name-input');
            const studentName = studentInput.value.trim() || `${historyLogs.length + 1}번 참여자`;

            historyLogs.unshift({
                time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                student: studentName,
                item: result.name
            });

            studentInput.value = '';
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = historyLogs.length;
            const listContainer = document.getElementById('history-list');
            const statsContainer = document.getElementById('stats-container');

            if (historyLogs.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">아직 진행된 뽑기 기록이 없습니다.</p>';
                statsContainer.innerHTML = '';
                return;
            }

            const counts = {};
            historyLogs.forEach(log => {
                counts[log.item] = (counts[log.item] || 0) + 1;
            });

            statsContainer.innerHTML = Object.entries(counts).map(([itemName, count]) => `
                <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-xs font-semibold text-pink-300">
                    <span>${itemName}:</span>
                    <span class="text-amber-300 font-bold">${count}회</span>
                </span>
            `).join('');

            listContainer.innerHTML = historyLogs.map(log => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-900 border border-slate-800/80 text-xs">
                    <div class="flex items-center gap-2">
                        <span class="text-slate-500 text-[10px]">${log.time}</span>
                        <span class="font-bold text-slate-200">${log.student}</span>
                    </div>
                    <span class="px-2.5 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                        ${log.item}
                    </span>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (historyLogs.length === 0) return;
            historyLogs = [];
            updateHistoryUI();
        }

        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
